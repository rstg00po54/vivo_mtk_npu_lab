name: Android C++ NPU Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runner already carries a current Android SDK.
      # android-actions/setup-android@v3 tries to install the removed legacy
      # package "tools" on this runner image and fails before compilation.
      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "No Android SDK at $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "No sdkmanager under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Validate scripts
        run: |
          bash -n tools/setup_litert_cpp_sdk.sh build.sh gradlew
          python3 -m py_compile tools/run_probe.py

      - name: Fetch official LiteRT 2.3.0 C++ SDK
        run: bash tools/setup_litert_cpp_sdk.sh

      - name: Build NDK APK
        run: bash ./gradlew -p android :app:assembleDebug --stacktrace

      - name: Publish debug APK for physical vivo testing
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vivo-mtk-npu-cpp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
