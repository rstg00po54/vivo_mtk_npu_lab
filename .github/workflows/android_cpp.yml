name: Android C++ NPU Probe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Validate scripts
        run: |
          bash -n tools/setup_litert_cpp_sdk.sh
          python3 -m py_compile tools/run_probe.py

      - name: Fetch official LiteRT 2.3.0 C++ SDK
        run: bash tools/setup_litert_cpp_sdk.sh

      - name: Build NDK APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Publish debug APK for physical vivo testing
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vivo-mtk-npu-cpp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
